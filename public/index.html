<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Lamp — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="title-area">
      <div class="brand">
        <div class="lamp-icon" aria-hidden="true"></div>
        <h1>SMART LAMP</h1>
      </div>
      <p class="subtitle">IOT LIGHTING CONTROL SYSTEM</p>
    </header>

    <main class="dashboard-grid">
      <section class="card status-card">
        <div class="card-label">
          <span id="espIconWrap"></span>
          ESP8266
        </div>
        <div class="status-row">
          <span class="dot"></span>
          <span id="connection">DISCONNECTED</span>
        </div>
        <div class="device-config">
          <input id="deviceIp" type="text" value="http://192.168.1.20" placeholder="http://192.168.1.20" />
          <button id="connectBtn">CONNECT</button>
        </div>
      </section>

      <section class="card ldr-card">
        <div class="card-label">
          <span id="ldrIconWrap"></span>
          LDR VALUE
        </div>
        <div class="ldr-value" id="ldrValue">547</div>
        <div class="bar-track"><div id="ldrBar" class="bar-fill"></div></div>
        <div class="ldr-state" id="ldrLabel">LIGHT</div>
      </section>

      <section class="card mode-card">
        <div class="card-label">
          <svg class="tiny-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          MODE
        </div>
        <div class="mode-toggle">
          <button class="mode active" data-mode="auto">AUTO</button>
          <button class="mode" data-mode="manual">MANUAL</button>
        </div>
      </section>

      <section class="card led-card">
        <div class="card-label">
          <span id="ledIconWrap"></span>
          LED STATUS
        </div>
        <div class="led-line">
          <div class="led-bulb"></div>
          <span id="ledStatus">OFF</span>
        </div>
      </section>

      <section class="card full-width manual-card auto">
        <div class="card-label centered-label">MANUAL CONTROL</div>
        <div class="manual-toggle-wrapper">
          <div class="manual-lock-state" aria-live="polite">
            <div class="lock-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v7"/>
                <path d="M7.5 5.5A8 8 0 1 0 16.5 5.5"/>
              </svg>
            </div>
            <div class="lock-text">LOCKED</div>
          </div>

          <button class="manual-toggle" aria-label="Toggle manual power" type="button">
            <svg class="manual-power-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v7"/>
              <path d="M7.5 5.5A8 8 0 1 0 16.5 5.5"/>
            </svg>
            <span class="manual-state">OFF</span>
          </button>
        </div>
      </section>
    </main>

    <button class="simulate-btn">Simulate Disconnect</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
